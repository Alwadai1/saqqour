<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="صقّور: تطبيق تعليمي يعلّم أطفال المرحلة الابتدائية حماية أنفسهم في الإنترنت باللعب">
<meta name="theme-color" content="#1d2547">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صقّور">
<title>صقّور - بطل الأمان الرقمي</title>
<style>
:root{--ink:#1d2547;--muted:#5d6789;--bg:#fff7ea;--card:#fff;--line:#efe2cc;--teal:#13b3a3;--teal-d:#0b8a7d;--sun:#ffc23d;--sun-d:#e09a00;--coral:#ff6b6b;--coral-d:#d94848;--violet:#7b61ff;--violet-d:#5a3fe0;--green:#22c55e;--green-d:#16a34a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Noto Kufi Arabic","Segoe UI","Tahoma","Geeza Pro","Arial",sans-serif;color:var(--ink);line-height:1.7;
background:#1b1f4b;background-image:radial-gradient(circle at 20% 20%,rgba(255,255,255,.09) 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,rgba(255,255,255,.06) 0 2px,transparent 3px),linear-gradient(160deg,#262e72,#121634);background-size:120px 120px,90px 90px,100% 100%;
display:flex;align-items:center;justify-content:center;min-height:100vh}
#app{position:relative;width:100%;max-width:440px;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:640px){#app{height:min(900px,94vh);border-radius:40px;border:10px solid #0e1230;box-shadow:0 30px 80px rgba(0,0,0,.45)}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--card);border-bottom:2px solid var(--line);flex-shrink:0}
.bar h2{font-size:17px;font-weight:800;text-align:center;flex:1}
.icon-btn{width:40px;height:40px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer;font-family:inherit;color:var(--ink);flex-shrink:0}
.screen{flex:1;overflow-y:auto;padding:18px 16px 28px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.btn{font-family:inherit;font-weight:800;font-size:16px;border:0;border-radius:18px;padding:13px 16px;background:var(--teal);color:#fff;box-shadow:0 5px 0 var(--teal-d);cursor:pointer;transition:transform .08s,box-shadow .08s;width:100%;display:block}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:18px;padding:15px;margin-top:14px}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.violet{background:var(--violet);box-shadow:0 5px 0 var(--violet-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.hero{text-align:center;padding-top:6px}
.float{animation:float 3s ease-in-out infinite;display:inline-block}
@keyframes float{50%{transform:translateY(-10px)}}
.logo{font-size:46px;font-weight:900;line-height:1.2;color:var(--ink);letter-spacing:-1px}
.logo span{color:var(--teal)}
.tag{display:inline-block;background:var(--sun);font-weight:800;padding:2px 16px;border-radius:30px;margin:4px 0 14px;font-size:15px}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px}
.bubble{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;font-size:15.5px;position:relative;box-shadow:0 4px 0 var(--line)}
.bubble.center{text-align:center;margin:6px 0 10px}
.bubble.lg{font-size:18px;font-weight:600;padding:18px}
.say{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px}
.say svg{flex-shrink:0}
.say .bubble{flex:1;border-bottom-right-radius:6px}
.mbig{text-align:center;margin:10px 0}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--teal);width:24px;border-radius:6px}
.h{font-size:19px;font-weight:800;margin:6px 0 12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.card.info{text-align:center;font-weight:700}
.card.q{font-size:18px;font-weight:700;text-align:center;padding:20px 16px}
.prog{height:12px;background:var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.prog div{height:100%;background:linear-gradient(90deg,var(--teal),var(--sun));border-radius:10px;transition:width .4s}
.qn{color:var(--muted);font-weight:700;font-size:14px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.opt{font-family:inherit;font-size:15.5px;font-weight:700;text-align:right;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.picked{border-color:var(--teal);background:#e6faf7}
.opt.done{border-color:var(--green);background:#eafcef}
.lbl{display:block;font-weight:800;margin:14px 0 6px}
.inp{width:100%;font-family:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.inp:focus{border-color:var(--teal)}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.avb{font-size:30px;padding:8px 0;border-radius:16px;border:3px solid var(--line);background:var(--card);cursor:pointer}
.avb.sel{border-color:var(--teal);background:#e6faf7;transform:scale(1.06)}
.kids{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kid{font-family:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--line)}
.kid .av{font-size:40px}.kid b{font-size:16px}.kid small{color:var(--muted)}
.kid.add{border-style:dashed}
.kidhead{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px 14px;margin-bottom:16px}
.kidhead .av{font-size:36px}.kidhead b{display:block;font-size:17px}.kidhead small{color:var(--muted);font-weight:700}
.path{display:flex;flex-direction:column;gap:16px}
.island{font-family:inherit;color:var(--ink);display:flex;align-items:center;gap:12px;width:88%;padding:12px;border-radius:22px;background:var(--card);border:3px solid var(--c);box-shadow:0 6px 0 var(--c);cursor:pointer;text-align:right}
.island.l{margin-inline-start:12%}
.island.final{--c:#ffc23d;width:100%;background:#fff5d6}
.island.locked{filter:grayscale(1);opacity:.55;cursor:not-allowed}
.iic{width:54px;height:54px;border-radius:16px;background:var(--c);display:grid;place-items:center;font-size:28px;flex-shrink:0}
.it{flex:1;font-size:15px;font-weight:700}.it b{display:block;font-size:12px;color:var(--muted)}
.stars{color:#d9cdb6;font-size:16px;letter-spacing:1px;white-space:nowrap}.stars i{font-style:normal;color:#ffb300}
.card.rule{background:#e9f9f6;border-color:#bfece5}
.card.rule p{margin-top:4px;font-size:14.5px}
.center-col{text-align:center}
.badge{width:110px;height:110px;margin:10px auto 6px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:56px;border:6px solid #fff;box-shadow:0 0 0 6px var(--c),0 10px 30px rgba(0,0,0,.15);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.win{font-size:24px;font-weight:900}.muted{color:var(--muted)}
.bigstars .stars{font-size:40px}
.lesson ul,.tips ul{padding-right:20px;margin-top:6px}.lesson li,.tips li{margin:4px 0}
.sheet-wrap{position:absolute;inset:0;background:rgba(20,24,56,.45);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 16px 22px;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
.sheet.good{border-top:6px solid var(--green)}.sheet.bad{border-top:6px solid var(--coral)}
.pw{min-height:58px;background:#1d2547;color:#fff;border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;direction:ltr;font-family:Consolas,monospace;font-size:20px;font-weight:700}
.pw span{background:rgba(255,255,255,.12);border-radius:8px;padding:0 6px}
.pw em{direction:rtl;font-family:inherit;font-style:normal;font-size:15px;opacity:.7}
.meter{height:14px;background:var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.meter div{height:100%;transition:width .35s,background .35s;border-radius:10px}
.mlabel{font-weight:800;text-align:center;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.chip{font-family:inherit;font-size:16px;font-weight:800;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink);box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.3}
.chip small{font-size:11px;color:var(--muted);font-weight:600}
.chip.sel{background:var(--violet);color:#fff;border-color:var(--violet-d);box-shadow:0 4px 0 var(--violet-d)}.chip.sel small{color:#e4defc}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.game{background:#20264f;border-radius:20px;overflow:hidden;border:3px solid #141838}
.ghead{background:#141838;color:#fff;padding:8px 12px;font-weight:800;font-size:14px;display:flex;justify-content:space-between}
.ghead span{color:#4ade80;font-size:12px}
.chat{padding:12px;display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto}
.msg{max-width:85%;padding:8px 12px;border-radius:16px;font-size:14.5px}
.msg.them{background:#fff;align-self:flex-start;border-bottom-right-radius:4px}
.msg.them b{display:block;font-size:12px;color:var(--coral-d)}
.msg.me{background:var(--teal);color:#fff;align-self:flex-end;border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:#ffe4e4;color:#b42323;font-size:13px;font-weight:700}
.hint{font-weight:800;margin-top:12px}
.scard{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;text-align:center;box-shadow:0 6px 0 var(--line);animation:pop .35s ease}
.scard .from{font-size:13px;font-weight:800;color:var(--muted);background:var(--bg);display:inline-block;padding:2px 12px;border-radius:20px;margin-bottom:6px}
.sc-ic{font-size:46px;line-height:1.3}
.sc-t{font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:900}.stat small{color:var(--muted);font-weight:700}
.stat.hi{background:#e9f9f6;border-color:#bfece5}.stat.hi b{color:var(--teal-d)}
.tbl{overflow-x:auto;background:var(--card);border:2px solid var(--line);border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg);font-weight:800}
tr:last-child td{border-bottom:0}
.ab-hero{background:linear-gradient(140deg,#262e72,#13b3a3);color:#fff;border-radius:24px;padding:20px;text-align:center}
.ab-hero h3{font-size:24px;font-weight:900}.ab-hero p{opacity:.9;font-size:14.5px}
.ab-tag{display:inline-block;background:var(--sun);color:var(--ink);font-weight:800;border-radius:20px;padding:2px 12px;font-size:12.5px;margin-top:8px}
.sec{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.sec h4{font-size:16.5px;font-weight:900;margin-bottom:4px}
.sec p,.sec li{font-size:14.5px}
.sec ul{padding-right:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mini{background:var(--bg);border-radius:14px;padding:10px;font-size:13.5px;font-weight:700;text-align:center}
.mini span{display:block;font-size:24px}
.road{border-right:3px dashed var(--teal);padding-right:14px;margin-top:6px}
.road div{position:relative;margin:8px 0;font-size:14.5px}
.road div::before{content:"";position:absolute;right:-22px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--teal);border:3px solid #fff}
.road div.now::before{background:var(--sun)}
.cert{background:#fff;border-radius:22px;padding:8px;border:3px solid var(--sun);box-shadow:0 8px 0 var(--sun-d)}
.cert-in{border:2px dashed var(--sun);border-radius:16px;padding:16px;text-align:center}
.cert h2{font-size:21px;font-weight:900;color:var(--teal-d)}
.cname{font-size:28px;font-weight:900;margin:6px 0;color:var(--ink)}
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.cstats div{background:var(--bg);border-radius:12px;padding:8px 4px}.cstats b{display:block;font-size:20px}.cstats small{font-size:11.5px;color:var(--muted)}
.cbadges{display:flex;justify-content:center;gap:10px;font-size:30px}
.cbadges>span{display:flex;flex-direction:column;align-items:center}.cbadges .stars{font-size:11px}
.cdate{font-size:12.5px;color:var(--muted);margin-top:8px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media print{
 body{background:#fff;display:block}
 #app{max-width:none;height:auto;border:0;box-shadow:none;border-radius:0;background:#fff}
 .bar,.two,.confetti,.sheet-wrap{display:none!important}
 .screen{overflow:visible;animation:none}
 .cert{box-shadow:none;max-width:600px;margin:30px auto}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var app=$('#app');
var KEY='saqqour_v1';
function load(){try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.kids))return p}}catch(e){}return {kids:[],current:null}}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function kid(){return S.kids.find(function(k){return k.id===S.current})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function totalStars(k){return k.m.reduce(function(s,x){return s+x},0)}
function stars(n){n=n||0;return '<span class="stars"><i>'+'★'.repeat(n)+'</i>'+'★'.repeat(3-n)+'</span>'}
function fmtDate(iso){var d=iso?new Date(iso):new Date(),g='',h='';
 try{g=d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){g=d.toISOString().slice(0,10)}
 try{h=d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){}
 return h&&h!==g?g+' · '+h:g}
function toEn(s){return s.replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})}

/* ---------- الصوت ---------- */
var soundOn=true,actx=null;
function beep(type){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 var notes=type==='ok'?[523,659,784]:type==='bad'?[330,247]:type==='win'?[523,659,784,1047]:[620];
 notes.forEach(function(f,i){var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.12;o.type='triangle';o.frequency.value=f;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.22)})}catch(e){}}

/* ---------- الشخصية: صقّور ---------- */
function mascot(size,mood){
 var brows=mood==='worried'
  ?'<path d="M40 37 L55 31" stroke="#5a3418" stroke-width="3.5" stroke-linecap="round"/><path d="M80 37 L65 31" stroke="#5a3418" stroke-width="3.5" stroke-linecap="round"/>'
  :'<path d="M40 34 Q48 29 56 33" stroke="#5a3418" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M80 34 Q72 29 64 33" stroke="#5a3418" stroke-width="3.5" fill="none" stroke-linecap="round"/>';
 var cheeks=mood==='worried'?'':'<circle cx="41" cy="53" r="4" fill="#ff9e9e" opacity=".6"/><circle cx="79" cy="53" r="4" fill="#ff9e9e" opacity=".6"/>';
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 120 120" aria-hidden="true">'+
 '<ellipse cx="60" cy="114" rx="28" ry="4.5" fill="rgba(0,0,0,.12)"/>'+
 '<path d="M24 72 Q6 56 16 38 Q30 56 36 74Z" fill="#94562a"/><path d="M96 72 Q114 56 104 38 Q90 56 84 74Z" fill="#94562a"/>'+
 '<ellipse cx="60" cy="74" rx="33" ry="35" fill="#c47a3d"/><ellipse cx="60" cy="84" rx="22" ry="21" fill="#f6dfba"/>'+
 '<circle cx="60" cy="42" r="28" fill="#c47a3d"/>'+
 '<path d="M35 45 Q60 20 85 45 Q79 64 60 64 Q41 64 35 45Z" fill="#f6dfba"/>'+
 '<circle cx="49" cy="43" r="8.5" fill="#fff"/><circle cx="71" cy="43" r="8.5" fill="#fff"/>'+
 '<circle cx="50" cy="44" r="5" fill="#1d2547"/><circle cx="70" cy="44" r="5" fill="#1d2547"/>'+
 '<circle cx="51.8" cy="42.2" r="1.7" fill="#fff"/><circle cx="71.8" cy="42.2" r="1.7" fill="#fff"/>'+
 brows+cheeks+
 '<path d="M54 51 Q60 48 66 51 Q63 61 60 63 Q57 59 54 51Z" fill="#ffc23d" stroke="#d99a12" stroke-width="1.5"/>'+
 '<path d="M60 72 L75 77 Q75 94 60 100 Q45 94 45 77Z" fill="#13b3a3" stroke="#0b8a7d" stroke-width="2.5"/>'+
 '<rect x="54" y="83" width="12" height="9" rx="2" fill="#fff"/><path d="M56.5 83 v-3 a3.5 3.5 0 0 1 7 0 v3" stroke="#fff" stroke-width="2" fill="none"/>'+
 '<path d="M50 107 v5 M70 107 v5" stroke="#ffc23d" stroke-width="4.5" stroke-linecap="round"/></svg>';
}
function say(t,mood){return '<div class="say">'+mascot(78,mood)+'<div class="bubble">'+t+'</div></div>'}
function confetti(){var c=['#ffc23d','#13b3a3','#ff6b6b','#7b61ff','#22c55e','#4cb8ff'],h='';for(var i=0;i<36;i++){h+='<i style="left:'+(Math.random()*100)+'%;background:'+c[i%6]+';animation-duration:'+(1.8+Math.random()*1.8)+'s;animation-delay:'+(Math.random()*.6)+'s"></i>'}return h}

/* ---------- عرض الشاشات ---------- */
function view(html,o){o=o||{};
 app.innerHTML=(o.title!==undefined?'<header class="bar">'+(o.back?'<button class="icon-btn" id="bk" aria-label="رجوع">→</button>':'<span style="width:40px"></span>')+'<h2>'+o.title+'</h2><button class="icon-btn" id="snd" aria-label="الصوت">'+(soundOn?'🔊':'🔇')+'</button></header>':'')+'<main class="screen">'+html+'</main>';
 if(o.back)$('#bk').onclick=function(){beep('tap');o.back()};
 var sb=$('#snd');if(sb)sb.onclick=function(){soundOn=!soundOn;sb.textContent=soundOn?'🔊':'🔇'};
}
function alertMsg(t){var d=document.createElement('div');d.textContent=t;d.style.cssText='position:absolute;left:50%;top:80px;transform:translateX(-50%);background:#1d2547;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:30;font-size:15px;box-shadow:0 8px 20px rgba(0,0,0,.25)';app.appendChild(d);setTimeout(function(){d.remove()},2600)}
function sheet(ok,text,next,btn){
 beep(ok?'ok':'bad');
 var d=document.createElement('div');d.className='sheet-wrap';

function parentGate(){
 var a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
 view(say('هذا الركن للكبار فقط 👨‍👩‍👧 جاوب على السؤال للدخول.')+'<div class="card q">كم حاصل '+a+' × '+b+' ؟</div><input class="inp" id="ans" inputmode="numeric" placeholder="الإجابة" autocomplete="off" style="margin-top:12px;text-align:center"><button class="btn big" id="ok">دخول</button>',{title:'ركن الكبار',back:home});

function dl(blob,name){var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function dashboard(){
 var ks=S.kids;
 var avg=function(a){return a.length?Math.round(a.reduce(function(s,x){return s+x},0)/a.length):null};
 var ap=avg(ks.filter(function(k){return k.pre!=null}).map(function(k){return k.pre}));
 var aq=avg(ks.filter(function(k){return k.post!=null}).map(function(k){return k.post}));
 var ai=avg(ks.filter(function(k){return k.pre!=null&&k.post!=null}).map(function(k){return k.post-k.pre}));
 var pc=function(v){return v==null?'—':v+'%'};
 view('<div class="stats"><div class="stat"><b>'+ks.length+'</b><small>عدد الأطفال</small></div><div class="stat"><b>'+pc(ap)+'</b><small>متوسط الاختبار القبلي</small></div><div class="stat"><b>'+pc(aq)+'</b><small>متوسط الاختبار البعدي</small></div><div class="stat hi"><b dir="ltr">'+(ai==null?'—':(ai>=0?'+':'')+ai+'%')+'</b><small>متوسط التحسّن</small></div></div>'+
 '<h3 class="h" style="margin-top:18px">نتائج الأطفال</h3>'+
 (ks.length?'<div class="tbl"><table><thead><tr><th>الطفل</th><th>قبلي</th><th>بعدي</th><th>المهام</th></tr></thead><tbody>'+ks.map(function(k){return '<tr><td>'+k.avatar+' '+esc(k.name)+'</td><td>'+pc(k.pre)+'</td><td>'+pc(k.post)+'</td><td>'+k.m.filter(function(x){return x}).length+'/4 · ⭐'+totalStars(k)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="card info">لا يوجد أطفال مسجّلون بعد على هذا الجهاز.</div>')+
 '<div class="two"><button class="btn sun" id="csv" '+(ks.length?'':'disabled')+'>⬇️ تصدير Excel</button><button class="btn ghost" id="del" '+(ks.length?'':'disabled')+'>🗑️ مسح البيانات</button></div>'+
 '<div class="two"><button class="btn violet" id="bkp" '+(ks.length?'':'disabled')+'>💾 نسخة احتياطية</button><label class="btn ghost" style="text-align:center;cursor:pointer">📂 استرجاع نسخة<input type="file" id="rst" accept=".json,application/json" style="display:none"></label></div>'+
 '<p class="foot" style="margin-top:8px">احفظ نسخة احتياطية بعد كل يوم تجربة، فبيانات المتصفح قد تُمسح.</p>'+
 '<div class="card tips"><b>💡 نصائح لولي الأمر</b><ul><li>اجعل استخدام الأجهزة في مكان مشترك بالبيت.</li><li>فعّل أدوات الرقابة الأبوية في الجوال والألعاب.</li><li>اتفق مع طفلك أن يخبرك بأي شيء يزعجه، دون خوف من العقاب.</li><li>راجع قائمة أصدقاء طفلك في الألعاب الإلكترونية.</li><li>ذكّره بالقاعدة الذهبية: توقّف، لا تضغط، أخبر شخصاً كبيراً.</li></ul></div>'+
 '<p class="foot">🔒 كل البيانات محفوظة على هذا الجهاز فقط ولا تُرسل لأي جهة.</p>',{title:'لوحة ولي الأمر والمعلم',back:home});
 $('#rst').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d||!Array.isArray(d.kids))throw 0;var ids={},added=0;S.kids.forEach(function(k){ids[k.id]=1});
  d.kids.forEach(function(k){if(k&&k.id&&typeof k.name==='string'&&Array.isArray(k.m)&&!ids[k.id]){S.kids.push({id:String(k.id),name:k.name.slice(0,20),avatar:String(k.avatar||'🦁').slice(0,4),pre:typeof k.pre==='number'?k.pre:null,post:typeof k.post==='number'?k.post:null,preAt:k.preAt||null,postAt:k.postAt||null,m:k.m.slice(0,4).map(function(x){return Math.max(0,Math.min(3,+x||0))}),created:k.created||null});added++}});
  save();beep('ok');alertMsg('تم استرجاع '+added+' طفل من النسخة الاحتياطية');dashboard()}catch(x){beep('bad');alertMsg('الملف غير صالح')}};r.readAsText(f)};
 if(ks.length){
  $('#csv').onclick=function(){var rows=[['الاسم','تاريخ التجربة','الاختبار القبلي %','الاختبار البعدي %','التحسن %','المهام المكتملة','النجوم']];
   ks.forEach(function(k){rows.push([k.name,(k.postAt||k.preAt||k.created||'').slice(0,10),k.pre==null?'':k.pre,k.post==null?'':k.post,(k.pre!=null&&k.post!=null)?k.post-k.pre:'',k.m.filter(function(x){return x}).length,totalStars(k)])});
   var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
   dl(new Blob([csv],{type:'text/csv;charset=utf-8'}),'نتائج-صقور-'+new Date().toISOString().slice(0,10)+'.csv')};
  $('#bkp').onclick=function(){var d=new Date().toISOString().slice(0,10);dl(new Blob([JSON.stringify({app:'saqqour',v:1,saved:new Date().toISOString(),kids:S.kids},null,1)],{type:'application/json'}),'صقور-نسخة-احتياطية-'+d+'.json')};
  $('#del').onclick=function(){if(confirm('هل تريد مسح بيانات جميع الأطفال من هذا الجهاز؟')){S={kids:[],current:null};save();dashboard()}};
 }
}
